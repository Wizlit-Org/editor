name: Publish Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to publish (e.g., v0.1.914-staging.0 or v0.1.914)'
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci || npm install
          npm install --no-save @rollup/rollup-linux-x64-gnu || true

      - name: Extract version from Git Tag & inject inline
        id: versioning
        run: |
          RAW_TAG="${{ github.event.inputs.tag }}"
          if [ -z "$RAW_TAG" ]; then
            RAW_TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${RAW_TAG#v}"
          if [ -z "$VERSION" ] || [[ ! "$RAW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Error: Invalid or missing version tag '$RAW_TAG' (expected vX.Y.Z or vX.Y.Z-staging.N)"
            exit 1
          fi

          npm version "${VERSION}" --no-git-tag-version --allow-same-version

          if [[ "$VERSION" == *"-"* ]]; then
            NPM_DIST_TAG="staging"
          else
            NPM_DIST_TAG="latest"
          fi

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=v$VERSION" >> $GITHUB_OUTPUT
          echo "NPM_DIST_TAG=$NPM_DIST_TAG" >> $GITHUB_OUTPUT
          echo "Injected inline version $VERSION (dist-tag: $NPM_DIST_TAG) without branch commit"

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --tag ${{ steps.versioning.outputs.NPM_DIST_TAG }} --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release (Official latest only)
        if: steps.versioning.outputs.NPM_DIST_TAG == 'latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ steps.versioning.outputs.TAG_NAME }}" >/dev/null 2>&1 || \
          gh release create "${{ steps.versioning.outputs.TAG_NAME }}" --generate-notes --title "${{ steps.versioning.outputs.TAG_NAME }}"
