name: Publish Package

on:
  push:
    branches:
      - main
      - staging

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci || npm install
          npm install --no-save @rollup/rollup-linux-x64-gnu || true

      - name: Determine target version & tag
        id: versioning
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Branch: $BRANCH"
          
          NEW_VERSION=$(node -e "
            const fs = require('fs');
            const semver = require('semver');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const current = pkg.version;
            let next;
            if ('$BRANCH' === 'staging') {
              next = current.includes('-staging.') ? semver.inc(current, 'prerelease', 'staging') : semver.inc(current, 'prepatch', 'staging');
            } else {
              next = semver.inc(current, 'patch');
            }
            pkg.version = next;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log(next);
          ")
          
          TAG_NAME="v$NEW_VERSION"
          NPM_DIST_TAG=$([ "$BRANCH" = "staging" ] && echo "staging" || echo "latest")
          
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "NPM_DIST_TAG=$NPM_DIST_TAG" >> $GITHUB_OUTPUT
          echo "Bumping package.json to $NEW_VERSION with dist-tag $NPM_DIST_TAG..."

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public --tag ${{ steps.versioning.outputs.NPM_DIST_TAG }} --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create and push Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.versioning.outputs.TAG_NAME }}"
          git push origin "${{ steps.versioning.outputs.TAG_NAME }}" || echo "Tag push skipped or restricted by repo ruleset"

      - name: Sync version to dev branch
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch origin dev:dev || true
          git checkout dev
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ steps.versioning.outputs.NEW_VERSION }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          git commit -am "chore(release): sync version to ${{ steps.versioning.outputs.NEW_VERSION }} [skip ci]" || echo "No changes to commit on dev"
          git push origin dev || echo "Failed to push to dev branch"
